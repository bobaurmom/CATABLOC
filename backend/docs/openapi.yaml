#swagger specification file
openapi: 3.0.0
info:
  title: CATABLOC API
  version: 1.0.0
paths: {
  "/register": {
    post:{
      tags: ["Authentication"],
      summary: "Register a new user",
      requestBody: {
        required: true,
        content: {
          "application/json": {
            schema: {
              type: "object",
              properties: {
                username: { type: "string" },
                email: { type: "string" },
                password: { type: "string" }
              },
              required: ["username", "email", "password"]
            }
          }
        }
      },
      responses: {
        201: {
          description: "User registered successfully",
          content: {
            "application/json": {
              schema: {
                type: "object",
                properties: {
                  id: { type: "string" },
                  username: { type: "string" },
                  email: { type: "string" }
                }
              }
            }
          }
        },
        400: {
          description: "Bad Request"
        }
      }
    }
  }
}